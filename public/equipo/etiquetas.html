<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Hoja de etiquetas</title>
<style>
:root{--m:5mm}
*{box-sizing:border-box}
body{margin:0;background:#EEE;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#111}
.barra{position:sticky;top:0;z-index:5;background:#2B2B2B;color:#fff;padding:12px 16px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:15px}
.barra button{min-height:40px;border:0;border-radius:8px;background:#fff;color:#222;font:700 15px system-ui;padding:0 16px}
.barra select{min-height:40px;border-radius:8px;border:0;padding:0 8px;font:15px system-ui}
.barra .n{opacity:.8;font-size:13px;flex-basis:100%}
.err{color:#B3402F;padding:14px 24px;font-weight:600;margin:0}
.hoja{width:210mm;height:297mm;margin:14px auto;background:#fff;padding:var(--m);display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(6,1fr);box-shadow:0 2px 10px rgba(0,0,0,.15);page-break-after:always;break-after:page;overflow:hidden}
.et{border:.2mm dashed #BBB;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:1.5mm;overflow:hidden}
.q{width:30mm;height:30mm;flex:none}.q svg{width:100%;height:100%;display:block}
.t1{font-weight:800;font-size:5mm;line-height:1.1;margin-top:.8mm}
.t2{font-size:2.8mm;line-height:1.2;margin-top:.6mm;color:#333}
.cd{font:2.3mm/1 ui-monospace,Menlo,monospace;color:#888;margin-top:.8mm;letter-spacing:.2mm}
@page{size:A4;margin:0}
@media print{body{background:#fff}.barra,#errs{display:none}.hoja{margin:0;box-shadow:none;width:210mm;height:297mm}.hoja:last-child{page-break-after:auto;break-after:auto}.et{border-color:#CCC}}
</style></head><body>
<div class="barra"><button id="imp" type="button">Imprimir</button><button id="pdf" type="button">Descargar PDF</button>
<label>Margen de la hoja <select id="mar"><option value="0">0 mm</option><option value="5" selected>5 mm</option><option value="10">10 mm</option></select></label>
<span class="n">Imprimir: en el cuadro de impresión elegí tamaño A4 y escala 100 % (sin «ajustar a la página»). Para llevar a una imprenta usá «Descargar PDF» (A4, vectorial, a tamaño real). Son 24 etiquetas por hoja, 4 columnas × 6 filas.</span></div>
<div id="errs"></div>
<div id="hojas"></div>
<script src="qr.js"></script>
<script>
(function(){
 var out=document.getElementById('hojas'),N=24,datos={},esperas=[];
 var cods=(new URLSearchParams(location.search).get('h')||'').toLowerCase().split(',').map(function(s){return s.trim()}).filter(function(s){return /^[a-z2-9]{6}$/.test(s)}).slice(0,20);
 function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
 function qrSvg(u){var z=qrcode(0,'M');z.addData(u);z.make();var n=z.getModuleCount(),d='';
  for(var r=0;r<n;r++)for(var k=0;k<n;k++)if(z.isDark(r,k))d+='M'+(k+4)+' '+(r+4)+'h1v1h-1z';
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+(n+8)+' '+(n+8)+'" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="'+d+'" fill="#000"/></svg>'}
 function hoja(c,h){
  var base=location.origin+'/q/'+c,html='';
  for(var i=0;i<N;i++){
   var mesa=h.tipo==='mesas'?(h.desde||1)+i:0;
   html+='<div class="et"><div class="q">'+qrSvg(mesa?base+'/'+mesa:base)+'</div>'
    +(mesa?'<div class="t1">Mesa '+mesa+'</div><div class="t2">Escaneá para ver la carta</div>':'<div class="t1">Mirá la carta</div><div class="t2">Escaneá este código</div>')
    +'<div class="cd">'+esc(c)+(mesa?' · '+mesa:'')+'</div></div>';
  }
  var d=document.createElement('div');d.className='hoja';d.innerHTML=html;return d}
 document.getElementById('imp').onclick=function(){window.print()};
 document.getElementById('mar').onchange=function(){document.documentElement.style.setProperty('--m',this.value+'mm')};
 var errs=document.getElementById('errs');
 function fallo(t){var p=document.createElement('p');p.className='err';p.textContent=t;errs.appendChild(p)}
 if(!window.qrcode){fallo('No se pudo cargar el generador de QR.');return}
 if(!cods.length){fallo('Falta el código de la hoja en la dirección (…?h=ab12cd).');return}
 cods.forEach(function(c){
  var lugar=document.createElement('div');out.appendChild(lugar);
  var pr=fetch('/api/hoja/'+c).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(h){datos[c]=h;lugar.replaceWith(hoja(c,h))})
   .catch(function(){lugar.remove();fallo('La hoja '+c+' no existe.')});
  esperas.push(pr.catch(function(){}));
 });

 // ── PDF vectorial (A4, 24 etiquetas por hoja), armado acá mismo sin librerías ──
 var cvs=document.createElement('canvas').getContext('2d');
 function ancho(t,sz,neg){cvs.font=(neg?'bold ':'')+'1000px Helvetica, Arial, sans-serif';return cvs.measureText(t).width/1000*sz}
 function lit(t){var o='(';for(var i=0;i<t.length;i++){var c=t.charCodeAt(i);if(c===40||c===41||c===92)o+='\\'+t[i];else if(c<32||c>126)o+='\\'+('00'+(c&255).toString(8)).slice(-3);else o+=t[i]}return o+')'}
 function f2(x){return x.toFixed(2)}
 function paginaPdf(c,h,mm){
  var W=595.28,H=841.89,pt=72/25.4,m=mm*pt,cw=(W-2*m)/4,ch=(H-2*m)/6,qs=30*pt,bloque=qs+33,s='q\n0.57 w [2 2] 0 d 0.73 G\n',txt='',cache={};
  for(var i=0;i<N;i++){
   var mesa=h.tipo==='mesas'?(h.desde||1)+i:0,url=location.origin+'/q/'+c+(mesa?'/'+mesa:'');
   var z=cache[url];if(!z){z=qrcode(0,'M');z.addData(url);z.make();cache[url]=z}
   var n=z.getModuleCount(),ms=qs/(n+8),col=i%4,fila=Math.floor(i/4),x0=m+col*cw,yT=H-m-fila*ch;
   s+=f2(x0)+' '+f2(yT-ch)+' '+f2(cw)+' '+f2(ch)+' re S\n';
   var qx=x0+(cw-qs)/2,qy=yT-(ch-bloque)/2;
   s+='0 g\n';
   for(var r=0;r<n;r++){var k=0;while(k<n){if(!z.isDark(r,k)){k++;continue}var k0=k;while(k<n&&z.isDark(r,k))k++;
     s+=f2(qx+(k0+4)*ms)+' '+f2(qy-(r+5)*ms)+' '+f2((k-k0)*ms)+' '+f2(ms)+' re\n'}}
   s+='f\n';
   var yb=qy-qs,t1=mesa?'Mesa '+mesa:'Mirá la carta',t2=mesa?'Escaneá para ver la carta':'Escaneá este código',t3=c+(mesa?' · '+mesa:'');
   var ty=yb-2.3-10.5,sy=ty-3-6.5,cy=sy-3-5.5;
   txt+='BT /F2 14.17 Tf 0 g '+f2(x0+(cw-ancho(t1,14.17,1))/2)+' '+f2(ty)+' Td '+lit(t1)+' Tj ET\n';
   txt+='BT /F1 7.94 Tf 0.2 g '+f2(x0+(cw-ancho(t2,7.94))/2)+' '+f2(sy)+' Td '+lit(t2)+' Tj ET\n';
   txt+='BT /F1 6.5 Tf 0.53 g '+f2(x0+(cw-ancho(t3,6.5))/2)+' '+f2(cy)+' Td '+lit(t3)+' Tj ET\n';
  }
  return s+'Q\n'+txt}
 function armarPdf(paginas){
  var o=[],np=paginas.length,kids=[];
  for(var i=0;i<np;i++)kids.push((5+2*i)+' 0 R');
  o[1]='<< /Type /Catalog /Pages 2 0 R >>';
  o[2]='<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+np+' >>';
  o[3]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
  o[4]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
  for(var j=0;j<np;j++){
   o[5+2*j]='<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents '+(6+2*j)+' 0 R >>';
   o[6+2*j]='<< /Length '+paginas[j].length+' >>\nstream\n'+paginas[j]+'endstream'}
  var out='%PDF-1.4\n',off=[];
  for(var k=1;k<o.length;k++){off[k]=out.length;out+=k+' 0 obj\n'+o[k]+'\nendobj\n'}
  var xr=out.length;out+='xref\n0 '+o.length+'\n0000000000 65535 f \n';
  for(var q=1;q<o.length;q++)out+=('0000000000'+off[q]).slice(-10)+' 00000 n \n';
  out+='trailer\n<< /Size '+o.length+' /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF\n';
  return new Blob([out],{type:'application/pdf'})}
 document.getElementById('pdf').onclick=function(){
  var b=this;b.disabled=true;
  Promise.all(esperas).then(function(){
   var ok=cods.filter(function(c){return datos[c]});if(!ok.length){fallo('No hay hojas para el PDF.');return}
   var mm=Number(document.getElementById('mar').value)||0;
   var blob=armarPdf(ok.map(function(c){return paginaPdf(c,datos[c],mm)}));
   var u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='etiquetas-'+ok.join('-')+'.pdf';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},5000)
  }).catch(function(){fallo('No se pudo armar el PDF.')}).then(function(){b.disabled=false})};
})();
</script></body></html>
