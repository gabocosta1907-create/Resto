<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#2B2B2B"><title>Mi carta · herramienta</title>
<style>
:root{--bg:#FAF8F3;--tx:#2B2B2B;--ac:#8A5A3C;--line:#E3DED2;--ok:#3F7D4E;--no:#B3402F}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:#2B2B2B;color:#fff;padding:12px 16px;display:flex;gap:10px;align-items:center;justify-content:space-between}
header b{font-size:17px}header button{background:#fff;color:#2B2B2B;border:0;border-radius:99px;padding:9px 16px;font:600 14px system-ui;min-height:40px}
header button:disabled{opacity:.4}
main{max-width:620px;margin:0 auto;padding:8px 16px 90px}
h2{font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--ac);margin:26px 0 6px}
.it{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.it .n{font-weight:600}.it .s{font-size:13.5px;opacity:.7;grid-column:1/3}
.it.off .n{opacity:.5;text-decoration:line-through}
.sw{min-width:112px;min-height:44px;border-radius:99px;border:2px solid var(--ok);background:#fff;color:var(--ok);font:700 14px system-ui;padding:0 14px}
.off .sw{border-color:var(--no);color:var(--no);background:#fff5f3}
.acc{grid-column:1/3;display:flex;gap:8px;flex-wrap:wrap}
.acc button,.add button,.dlg button{min-height:42px;border-radius:10px;border:1px solid var(--line);background:#fff;font:600 14px system-ui;padding:0 14px;color:var(--tx)}
.acc .q{color:var(--no)}
.add{margin:10px 0 0}.add button{width:100%;border-style:dashed;color:var(--ac)}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:9}
.dlg.on{display:flex}.dlg .c{background:#fff;width:100%;max-width:620px;border-radius:18px 18px 0 0;padding:20px 16px 24px}
.dlg h3{margin:0 0 12px;font-size:18px}.dlg input,.dlg textarea{width:100%;font:16px system-ui;padding:12px;border:1px solid var(--line);border-radius:10px;margin:0 0 10px}
.dlg .row{display:flex;gap:8px}.dlg .row button{flex:1}.dlg .go{background:#2B2B2B;color:#fff;border-color:#2B2B2B}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#2B2B2B;color:#fff;padding:12px 18px;border-radius:12px;max-width:90%;z-index:10;display:none;font-size:15px}
.err{color:var(--no)}.cent{padding:60px 20px;text-align:center}
</style></head><body>
<div id="app"><div class="cent">Cargando…</div></div>
<div class="dlg" id="dlg"><div class="c" id="dc"></div></div><div class="toast" id="toast"></div>
<script>
(async()=>{
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tok='';try{const h=new URLSearchParams(location.hash.slice(1)).get('t');if(h){localStorage.setItem('resto_tok',h);history.replaceState(null,'',location.pathname)}tok=localStorage.getItem('resto_tok')||''}catch(e){}
const app=$('#app');
const api=async(p,o={})=>{const r=await fetch(p,{...o,headers:{authorization:'Bearer '+tok,'content-type':'application/json'}});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Error');return j};
let who,base,est;
const fmt=p=>'$'+String(p).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3200)};
try{who=await api('/api/yo')}catch(e){app.innerHTML='<div class="cent"><b>No tenés acceso.</b><p>Abrí el link o el QR que te dejó nuestro equipo.</p></div>';return}
base=await (await fetch('/'+who.slug+'/resto.json')).json();
async function cargar(){est=await (await fetch('/api/estado/'+who.slug,{cache:'no-cache'})).json();pintar()}
function lista(s){const e=est;const its=(s.items||[]).filter(i=>!(e.bajas||[]).includes(i.id)).map(i=>{const o=(e.items||{})[i.id]||{};return {id:i.id,n:o.nombre||i.nombre,d:o.desc!==undefined?o.desc:i.desc,p:o.precio!=null?o.precio:i.precio,v:(i.variantes||[]).map(v=>({n:v.n,p:o.vp&&o.vp[v.n]!=null?o.vp[v.n]:v.p})),off:!!o.off}});
 (e.altas||[]).filter(a=>a.seccion===s.id).forEach(a=>its.push({id:a.id,n:a.nombre,d:a.desc,p:a.precio,v:[],off:false,nuevo:true}));return its}
function pintar(){
 let h=`<header><b>${esc(base.resto.nombre||'Mi carta')}</b><button id="und">Deshacer</button></header><main>`;
 base.secciones.filter(s=>!s.oculta).forEach(s=>{h+=`<h2>${esc(s.titulo)}</h2>`;
  lista(s).forEach(i=>{h+=`<div class="it${i.off?' off':''}" data-id="${esc(i.id)}"><div><div class="n">${esc(i.n)}</div></div><button class="sw" data-a="${i.off?'reactivar':'suspender'}">${i.off?'No disponible':'Disponible'}</button>
   <div class="s">${i.v.length?i.v.map(v=>esc(v.n)+' '+fmt(v.p)).join(' · '):(i.p!=null?fmt(i.p):'')}</div>
   <div class="acc"><button data-a="precio">Precio</button><button data-a="modificar">Editar texto</button><button class="q" data-a="quitar">Quitar</button></div></div>`});
  h+=`<div class="add"><button data-a="agregar" data-s="${esc(s.id)}">+ Agregar plato en ${esc(s.titulo)}</button></div>`});
 app.innerHTML=h+'</main>';
 const hist=est.v>0;$('#und').disabled=!hist;
}
const dlg=(html,on)=>{$('#dc').innerHTML=html;$('#dlg').classList.add('on');on&&on();const c=()=>$('#dlg').classList.remove('on');$('#dc').querySelectorAll('[data-x]').forEach(b=>b.onclick=c);return c};
async function op(b){try{const r=await api('/api/op',{method:'POST',body:JSON.stringify(b)});est=r.estado;pintar();toast(r.msg)}catch(e){toast('No se pudo: '+e.message)}}
const buscar=id=>{for(const s of base.secciones){const x=lista(s).find(i=>i.id===id);if(x)return x}};
app.addEventListener('click',e=>{
 if(e.target.id==='und'){if(confirm('¿Deshacer el último cambio?'))op({op:'deshacer'});return}
 const b=e.target.closest('button[data-a]');if(!b)return;const a=b.dataset.a,row=b.closest('.it'),id=row&&row.dataset.id,it=id&&buscar(id);
 if(a==='suspender'||a==='reactivar')return op({op:a,id});
 if(a==='quitar')return dlg(`<h3>¿Quitar «${esc(it.n)}» de la carta?</h3><p>Se puede deshacer desde el botón Deshacer.</p><div class="row"><button data-x>Cancelar</button><button class="go" id="ok">Quitar</button></div>`,()=>$('#ok').onclick=()=>{$('#dlg').classList.remove('on');op({op:'quitar',id})});
 if(a==='precio'){const vs=it.v;const c=dlg(`<h3>Precio de ${esc(it.n)}</h3>${vs.length?`<select id="vn" style="width:100%;padding:12px;margin:0 0 10px;font:16px system-ui">${vs.map(v=>`<option>${esc(v.n)}</option>`).join('')}</select>`:''}<input id="pv" inputmode="numeric" placeholder="Nuevo precio, ej. 24000"><div class="row"><button data-x>Cancelar</button><button class="go" id="ok">Guardar</button></div>`,()=>{$('#pv').focus();$('#ok').onclick=()=>{const n=Number($('#pv').value.replace(/\D/g,''));if(!n)return toast('Escribí el precio');const v=$('#vn')&&$('#vn').value;$('#dlg').classList.remove('on');op({op:'precio',id,precio:n,variante:v})}});return}
 if(a==='modificar')return dlg(`<h3>Editar texto</h3><input id="nm" value="${esc(it.n)}" maxlength="80"><textarea id="ds" rows="3" maxlength="300" placeholder="Descripción">${esc(it.d||'')}</textarea><div class="row"><button data-x>Cancelar</button><button class="go" id="ok">Guardar</button></div>`,()=>$('#ok').onclick=()=>{$('#dlg').classList.remove('on');op({op:'modificar',id,nombre:$('#nm').value,desc:$('#ds').value})});
 if(a==='agregar'){const s=b.dataset.s;dlg(`<h3>Agregar plato</h3><input id="nm" placeholder="Nombre" maxlength="80"><textarea id="ds" rows="2" maxlength="300" placeholder="Descripción (opcional)"></textarea><input id="pv" inputmode="numeric" placeholder="Precio, ej. 9500"><div class="row"><button data-x>Cancelar</button><button class="go" id="ok">Agregar</button></div>`,()=>{$('#nm').focus();$('#ok').onclick=()=>{const n=Number($('#pv').value.replace(/\D/g,''));if(!$('#nm').value.trim()||!n)return toast('Falta el nombre o el precio');$('#dlg').classList.remove('on');op({op:'agregar',seccion:s,nombre:$('#nm').value,desc:$('#ds').value,precio:n})}})}
});
cargar();
})();
</script></body></html>
